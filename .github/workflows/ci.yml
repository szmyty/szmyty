name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Install runtime dependencies
        run: poetry install --no-interaction --no-root

      - name: Install lint and test tools
        run: poetry run python -m pip install pytest ruff yamllint

      - name: Validate profile inputs
        run: poetry run python -m tools.profile_builder.cli validate

      - name: Validate profile assets
        run: poetry run python profile/validate_assets.py assets/profile

      - name: Lint Python
        run: poetry run ruff check tests/test_workflows.py

      - name: Lint workflow YAML
        run: poetry run yamllint .github/workflows .github/dependabot.yml Taskfile.yml

      - name: Run tests
        run: poetry run python -m pytest
