name: Update Profile Modules

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'profile/fixtures/**'
      - 'profile/content/music-highlight.yml'

permissions:
  contents: write

jobs:
  update-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pydantic jinja2 pyyaml click requests

      - name: Fetch and render GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/modules/github_metrics.py --output profile/artifacts/github-metrics/cache.json

      - name: Fetch and render recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/modules/recent_activity.py --output profile/artifacts/recent-activity/cache.json

      - name: Render music highlight
        run: python tools/modules/music_highlight.py --input profile/content/music-highlight.yml --output profile/artifacts/music-highlight/music.yml

      - name: Update README regions
        run: python tools/modules/update_readme.py

      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: 'chore(profile): update dynamic modules [skip ci]'
          file_pattern: 'README.md profile/artifacts/**'
