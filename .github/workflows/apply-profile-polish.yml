name: Apply profile telemetry polish

on:
  push:
    branches:
      - feat/profile-telemetry-polish
    paths:
      - ".github/workflows/apply-profile-polish.yml"
      - ".profile-polish/part-*"

permissions:
  contents: write

concurrency:
  group: apply-profile-polish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore implementation payload
        run: |
          cat .profile-polish/part-* > "${RUNNER_TEMP}/profile-polish.tar.gz.b64"
          base64 --decode "${RUNNER_TEMP}/profile-polish.tar.gz.b64" \
            > "${RUNNER_TEMP}/profile-polish.tar.gz"
          tar --extract --gzip --file "${RUNNER_TEMP}/profile-polish.tar.gz" \
            --directory .

      - name: Commit prepared implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            README.md \
            .github/workflows/update-profile.yml \
            docs/ARCHITECTURE.md \
            docs/PRIVACY.md \
            docs/adr/0003-profile-telemetry-polish.md \
            profile/content/modules-registry.yml \
            profile/content/modules.yml \
            profile/fixtures/monkeytype.json \
            profile/templates/monkeytype.md.j2 \
            profile/templates/steam.md.j2 \
            profile/artifacts/monkeytype \
            profile/artifacts/weather \
            profile/artifacts/github-dashboard \
            tools/modules/monkeytype.py \
            tools/modules/weather.py \
            tools/profile_builder/github_dashboard/metrics.py \
            tools/profile_builder/github_dashboard/renderer.py \
            tests/test_monkeytype.py \
            tests/test_weather.py \
            tests/test_profile_telemetry_polish.py \
            tests/test_snapshot_platform.py

          if git diff --cached --quiet; then
            printf '%s\n' "Prepared implementation already applied."
            exit 0
          fi

          git commit -m "feat(profile): add Monkeytype and polish telemetry cards"
          git push origin HEAD:feat/profile-telemetry-polish
