name: Apply profile telemetry polish

on:
  push:
    branches:
      - feat/profile-telemetry-polish
    paths:
      - ".github/workflows/apply-profile-polish.yml"
      - ".profile-polish/part-*"

permissions:
  contents: write

concurrency:
  group: apply-profile-polish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Recover implementation payload
        run: |
          cp tests/test_snapshot_platform.py \
            "${RUNNER_TEMP}/test_snapshot_platform.py"

          cat .profile-polish/part-* \
            > "${RUNNER_TEMP}/profile-polish.tar.gz.b64"
          base64 --decode "${RUNNER_TEMP}/profile-polish.tar.gz.b64" \
            > "${RUNNER_TEMP}/profile-polish.tar.gz"

          python - <<'PY'
          import os
          from pathlib import Path
          import zlib

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          source = runner_temp / "profile-polish.tar.gz"
          target = runner_temp / "profile-polish.tar"
          compressed = source.read_bytes()
          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          recovered = bytearray()

          for offset in range(0, len(compressed), 4096):
              recovered.extend(
                  decompressor.decompress(compressed[offset : offset + 4096])
              )

          target.write_bytes(recovered)
          print(
              f"Recovered {len(recovered):,} tar bytes "
              f"from {len(compressed):,} compressed bytes."
          )
          PY

          tar --extract \
            --file "${RUNNER_TEMP}/profile-polish.tar" \
            --directory . \
            --ignore-zeros

          if ! python -m py_compile tests/test_snapshot_platform.py; then
            cp "${RUNNER_TEMP}/test_snapshot_platform.py" \
              tests/test_snapshot_platform.py
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_snapshot_platform.py")
          content = path.read_text(encoding="utf-8")
          old = (
              '_THIRD_PARTY_API_MODULES = '
              '{"soundcloud", "steam", "oura-trends"}'
          )
          new = (
              '_THIRD_PARTY_API_MODULES = '
              '{"monkeytype", "soundcloud", "steam", "oura-trends"}'
          )
          if old in content:
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path

          expected = [
              "README.md",
              ".github/workflows/update-profile.yml",
              "docs/ARCHITECTURE.md",
              "docs/PRIVACY.md",
              "docs/adr/0003-profile-telemetry-polish.md",
              "profile/content/modules-registry.yml",
              "profile/content/modules.yml",
              "profile/fixtures/monkeytype.json",
              "profile/templates/monkeytype.md.j2",
              "profile/templates/steam.md.j2",
              "profile/artifacts/monkeytype/cache.json",
              "profile/artifacts/monkeytype/metadata.json",
              "profile/artifacts/monkeytype/card-light.svg",
              "profile/artifacts/monkeytype/card-dark.svg",
              "profile/artifacts/monkeytype/card-mobile-light.svg",
              "profile/artifacts/monkeytype/card-mobile-dark.svg",
              "profile/artifacts/weather/card-light.svg",
              "profile/artifacts/weather/card-dark.svg",
              "profile/artifacts/weather/card-mobile-light.svg",
              "profile/artifacts/weather/card-mobile-dark.svg",
              "profile/artifacts/github-dashboard/card-light.svg",
              "profile/artifacts/github-dashboard/card-dark.svg",
              "profile/artifacts/github-dashboard/card-mobile-light.svg",
              "profile/artifacts/github-dashboard/card-mobile-dark.svg",
              "tools/modules/monkeytype.py",
              "tools/modules/weather.py",
              "tools/profile_builder/github_dashboard/metrics.py",
              "tools/profile_builder/github_dashboard/renderer.py",
              "tests/test_monkeytype.py",
              "tests/test_weather.py",
              "tests/test_profile_telemetry_polish.py",
              "tests/test_snapshot_platform.py",
          ]
          missing = [value for value in expected if not Path(value).is_file()]
          if missing:
              raise SystemExit(f"Missing recovered payload files: {missing}")
          PY

      - name: Install validation dependencies
        run: poetry install --with lint,test --no-interaction --no-root

      - name: Validate profile inputs
        run: poetry run python -m tools.profile_builder.cli validate

      - name: Validate profile assets
        run: poetry run python profile/validate_assets.py assets/profile

      - name: Lint Python
        run: poetry run ruff check .

      - name: Check Python formatting
        run: poetry run ruff format --check .

      - name: Lint workflow YAML
        run: >-
          poetry run yamllint
          .github/workflows
          .github/dependabot.yml
          Taskfile.yml

      - name: Run full test suite
        run: poetry run python -m pytest

      - name: Validate repository identity
        run: bash .tasks/check-identity.sh

      - name: Check whitespace
        run: git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            README.md \
            .github/workflows/update-profile.yml \
            docs/ARCHITECTURE.md \
            docs/PRIVACY.md \
            docs/adr/0003-profile-telemetry-polish.md \
            profile/content/modules-registry.yml \
            profile/content/modules.yml \
            profile/fixtures/monkeytype.json \
            profile/templates/monkeytype.md.j2 \
            profile/templates/steam.md.j2 \
            profile/artifacts/monkeytype \
            profile/artifacts/weather \
            profile/artifacts/github-dashboard \
            tools/modules/monkeytype.py \
            tools/modules/weather.py \
            tools/profile_builder/github_dashboard/metrics.py \
            tools/profile_builder/github_dashboard/renderer.py \
            tests/test_monkeytype.py \
            tests/test_weather.py \
            tests/test_profile_telemetry_polish.py \
            tests/test_snapshot_platform.py

          git commit \
            -m "feat(profile): add Monkeytype and polish telemetry cards"
          git push origin HEAD:feat/profile-telemetry-polish
