name: Update Profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  issues:
    types:
      - closed
      - edited
      - labeled
      - reopened
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-profile.yml"
      - "profile/content/ai-agent-showcase.yml"
      - "profile/fixtures/github-dashboard.json"
      - "profile/fixtures/ai-agent-showcase.json"
      - "profile/templates/github-dashboard*.j2"
      - "profile/templates/ai-agent-showcase*.j2"
      - "tools/modules/github_dashboard.py"
      - "tools/modules/ai_agent_showcase.py"
      - "tools/profile_builder/github_dashboard/**"
      - "tools/profile_builder/models.py"

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: true

concurrency:
  group: update-profile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Restore Poetry virtualenv
        # actions/cache v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install runtime dependencies
        run: poetry install --only main --no-interaction --no-root

      - name: Validate profile inputs
        run: poetry run python -m tools.profile_builder.cli validate

  refresh:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    outputs:
      had_failures: ${{ steps.summarize.outputs.had_failures }}

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Restore Poetry virtualenv
        # actions/cache v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install runtime dependencies
        run: poetry install --only main --no-interaction --no-root

      - name: Refresh GitHub dashboard
        id: github_dashboard
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          poetry run python -m tools.modules.github_dashboard
          --output-dir profile/artifacts/github-dashboard

      - name: Refresh AI agent showcase
        id: ai_agent_showcase
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          poetry run python -m tools.modules.ai_agent_showcase
          --input profile/content/ai-agent-showcase.yml
          --output profile/artifacts/ai-agent-showcase/cache.json
          --card-output profile/artifacts/ai-agent-showcase/card.svg
          --page-output site/ai-agent-showcase.html

      - name: Refresh music highlight
        id: music_highlight
        continue-on-error: true
        run: >-
          poetry run python -m tools.modules.music_highlight
          --input profile/content/music-highlight.yml
          --output profile/artifacts/music-highlight/music.yml

      - name: Render README regions
        run: poetry run python -m tools.modules.update_readme

      - name: Summarize module refresh
        id: summarize
        env:
          GITHUB_DASHBOARD_OUTCOME: ${{ steps.github_dashboard.outcome }}
          AI_AGENT_SHOWCASE_OUTCOME: ${{ steps.ai_agent_showcase.outcome }}
          MUSIC_HIGHLIGHT_OUTCOME: ${{ steps.music_highlight.outcome }}
        run: |
          poetry run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          import yaml

          items = [
              ("github-dashboard", Path("profile/artifacts/github-dashboard/snapshot.json"), os.environ["GITHUB_DASHBOARD_OUTCOME"]),
              ("ai-agent-showcase", Path("profile/artifacts/ai-agent-showcase/cache.json"), os.environ["AI_AGENT_SHOWCASE_OUTCOME"]),
              ("music-highlight", Path("profile/artifacts/music-highlight/music.yml"), os.environ["MUSIC_HIGHLIGHT_OUTCOME"]),
          ]

          print("### Module refresh summary")
          for name, path, outcome in items:
              source = "missing"
              if path.exists():
                  if path.suffix == ".json":
                      payload = json.loads(path.read_text(encoding="utf-8"))
                      source = payload.get("data_source") or payload.get("status", {}).get("data_source", "unknown")
                  else:
                      source = (yaml.safe_load(path.read_text(encoding="utf-8")) or {}).get("data_source", "unknown")
              print(f"- {name}: {outcome}; data source: {source}")
          PY

          had_failures=false
          for outcome in \
            "$GITHUB_DASHBOARD_OUTCOME" \
            "$AI_AGENT_SHOWCASE_OUTCOME" \
            "$MUSIC_HIGHLIGHT_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              had_failures=true
            fi
          done

          echo "had_failures=$had_failures" >> "$GITHUB_OUTPUT"

      - name: Upload refreshed profile files
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-refresh
          path: |
            README.md
            profile/artifacts/github-dashboard/snapshot.json
            profile/artifacts/github-dashboard/metadata.json
            profile/artifacts/github-dashboard/card-light.svg
            profile/artifacts/github-dashboard/card-dark.svg
            profile/artifacts/github-dashboard/card-mobile-light.svg
            profile/artifacts/github-dashboard/card-mobile-dark.svg
            profile/artifacts/ai-agent-showcase/cache.json
            profile/artifacts/ai-agent-showcase/card.svg
            profile/artifacts/music-highlight/music.yml
            site/ai-agent-showcase.html

  commit:
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # persist-credentials must remain enabled so this job can git push
          persist-credentials: true
          fetch-depth: 0

      - name: Download refreshed profile files
        # actions/download-artifact v4
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: profile-refresh
          path: .

      - name: Commit semantic changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/artifacts/github-dashboard/snapshot.json \
            profile/artifacts/github-dashboard/metadata.json \
            profile/artifacts/github-dashboard/card-light.svg \
            profile/artifacts/github-dashboard/card-dark.svg \
            profile/artifacts/github-dashboard/card-mobile-light.svg \
            profile/artifacts/github-dashboard/card-mobile-dark.svg \
            profile/artifacts/ai-agent-showcase/cache.json \
            profile/artifacts/ai-agent-showcase/card.svg \
            profile/artifacts/music-highlight/music.yml
          git add site/ai-agent-showcase.html

          if git diff --cached --quiet; then
            echo "No semantic profile changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(profile): refresh public modules"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts." >&2
              exit 1
            fi
            git fetch origin master
            git rebase origin/master
          done

  report-partial-failure:
    runs-on: ubuntu-latest
    needs:
      - refresh
      - commit
    if: always() && needs.refresh.outputs.had_failures == 'true'
    permissions: {}

    steps:
      - name: Mark run as partially failed
        run: |
          echo "One or more module refresh steps failed; unchanged cached output was preserved where available." >> "$GITHUB_STEP_SUMMARY"
          exit 1
