name: Update Profile

on:
  schedule:
    - cron: "17 0,3,9,12,15,18,21 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
  issues:
    types:
      - closed
      - edited
      - labeled
      - reopened
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-profile.yml"
      - "profile/content/ai-agent-showcase.yml"
      - "profile/content/modules-registry.yml"
      - "profile/fixtures/github-dashboard.json"
      - "profile/fixtures/ai-agent-showcase.json"
      - "profile/fixtures/weather.json"
      - "profile/fixtures/steam.json"
      - "profile/fixtures/oura-trends.json"
      - "profile/templates/github-dashboard*.j2"
      - "profile/templates/ai-agent-showcase*.j2"
      - "profile/templates/weather.md.j2"
      - "profile/templates/steam.md.j2"
      - "profile/templates/oura-trends.md.j2"
      - "tools/modules/github_dashboard.py"
      - "tools/modules/ai_agent_showcase.py"
      - "tools/modules/weather.py"
      - "tools/modules/steam.py"
      - "tools/modules/oura_trends.py"
      - "tools/profile_builder/github_dashboard/**"
      - "tools/profile_builder/models.py"

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: true

concurrency:
  group: update-profile-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Restore Poetry virtualenv
        # actions/cache v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install runtime dependencies
        run: poetry install --only main --no-interaction --no-root

      - name: Validate profile inputs
        run: poetry run python -m tools.profile_builder.cli validate

  refresh:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    outputs:
      had_failures: ${{ steps.summarize.outputs.had_failures }}

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Restore Poetry virtualenv
        # actions/cache v4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}

      - name: Install runtime dependencies
        run: poetry install --only main --no-interaction --no-root

      - name: Refresh weather
        id: weather
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          poetry run python -m tools.modules.weather
          --output profile/artifacts/weather/cache.json

      - name: Refresh GitHub dashboard
        id: github_dashboard
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          poetry run python -m tools.modules.github_dashboard
          --output-dir profile/artifacts/github-dashboard

      - name: Refresh AI agent showcase
        id: ai_agent_showcase
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          poetry run python -m tools.modules.ai_agent_showcase
          --input profile/content/ai-agent-showcase.yml
          --output profile/artifacts/ai-agent-showcase/cache.json
          --card-output profile/artifacts/ai-agent-showcase/card.svg
          --page-output site/ai-agent-showcase.html

      - name: Refresh music highlight
        id: music_highlight
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        continue-on-error: true
        run: >-
          poetry run python -m tools.modules.music_highlight
          --input profile/content/music-highlight.yml
          --output profile/artifacts/music-highlight/music.yml

      - name: Refresh Steam snapshot
        id: steam
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        continue-on-error: true
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          STEAM_ID64: ${{ vars.STEAM_ID64 }}
        run: >-
          poetry run python -m tools.modules.steam
          --output profile/artifacts/steam/cache.json

      - name: Refresh Oura aggregate trends
        id: oura_trends
        if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * *'
        continue-on-error: true
        env:
          OURA_ACCESS_TOKEN: ${{ secrets.OURA_ACCESS_TOKEN }}
        run: >-
          poetry run python -m tools.modules.oura_trends
          --allow-publication
          --output profile/artifacts/oura-trends/cache.json

      - name: Render README regions
        run: poetry run python -m tools.modules.update_readme

      - name: Summarize module refresh
        id: summarize
        env:
          WEATHER_OUTCOME: ${{ steps.weather.outcome }}
          GITHUB_DASHBOARD_OUTCOME: ${{ steps.github_dashboard.outcome }}
          AI_AGENT_SHOWCASE_OUTCOME: ${{ steps.ai_agent_showcase.outcome }}
          MUSIC_HIGHLIGHT_OUTCOME: ${{ steps.music_highlight.outcome }}
          STEAM_OUTCOME: ${{ steps.steam.outcome }}
          OURA_TRENDS_OUTCOME: ${{ steps.oura_trends.outcome }}
        run: |
          poetry run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          import yaml

          items = [
              ("weather", Path("profile/artifacts/weather/cache.json"), os.environ["WEATHER_OUTCOME"]),
              ("github-dashboard", Path("profile/artifacts/github-dashboard/snapshot.json"), os.environ["GITHUB_DASHBOARD_OUTCOME"]),
              ("ai-agent-showcase", Path("profile/artifacts/ai-agent-showcase/cache.json"), os.environ["AI_AGENT_SHOWCASE_OUTCOME"]),
              ("music-highlight", Path("profile/artifacts/music-highlight/music.yml"), os.environ["MUSIC_HIGHLIGHT_OUTCOME"]),
              ("steam", Path("profile/artifacts/steam/cache.json"), os.environ["STEAM_OUTCOME"]),
              ("oura-trends", Path("profile/artifacts/oura-trends/cache.json"), os.environ["OURA_TRENDS_OUTCOME"]),
          ]

          print("### Module refresh summary")
          for name, path, outcome in items:
              source = "missing"
              if path.exists():
                  if path.suffix == ".json":
                      payload = json.loads(path.read_text(encoding="utf-8"))
                      source = payload.get("data_source") or payload.get("status", {}).get("data_source", "unknown")
                  else:
                      source = (yaml.safe_load(path.read_text(encoding="utf-8")) or {}).get("data_source", "unknown")
              print(f"- {name}: {outcome}; data source: {source}")
          PY

          had_failures=false
          for outcome in \
            "$WEATHER_OUTCOME" \
            "$GITHUB_DASHBOARD_OUTCOME" \
            "$AI_AGENT_SHOWCASE_OUTCOME" \
            "$MUSIC_HIGHLIGHT_OUTCOME" \
            "$STEAM_OUTCOME" \
            "$OURA_TRENDS_OUTCOME"; do
            if [ "$outcome" = "failure" ]; then
              had_failures=true
            fi
          done

          printf 'had_failures=%s\n' "$had_failures" >> "$GITHUB_OUTPUT"

      - name: Upload refreshed profile files
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-refresh
          path: |
            README.md
            profile/artifacts/github-dashboard/
            profile/artifacts/weather/
            profile/artifacts/ai-agent-showcase/
            profile/artifacts/music-highlight/
            profile/artifacts/steam/
            profile/artifacts/oura-trends/
            site/ai-agent-showcase.html

  commit:
    runs-on: ubuntu-latest
    needs: refresh
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        # actions/checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # persist-credentials must remain enabled so this job can git push
          persist-credentials: true
          fetch-depth: 0

      - name: Download refreshed profile files
        # actions/download-artifact v4
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: profile-refresh
          path: .

      - name: Commit semantic changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md \
            profile/artifacts/github-dashboard \
            profile/artifacts/weather \
            profile/artifacts/ai-agent-showcase \
            profile/artifacts/music-highlight \
            profile/artifacts/steam \
            profile/artifacts/oura-trends \
            site/ai-agent-showcase.html

          if git diff --cached --quiet; then
            printf '%s\n' "No semantic profile changes detected." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "chore(profile): refresh public modules"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              printf '%s\n' "Push failed after 3 attempts." >&2
              exit 1
            fi
            git fetch origin master
            git rebase origin/master
          done

  report-partial-failure:
    runs-on: ubuntu-latest
    needs:
      - refresh
      - commit
    if: always() && needs.refresh.outputs.had_failures == 'true'
    permissions: {}

    steps:
      - name: Mark run as partially failed
        run: |
          printf '%s\n' \
            "One or more module refresh steps failed; cached output was preserved." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
