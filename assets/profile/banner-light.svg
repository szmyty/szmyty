<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Alan Szmyt — connected systems in continuous motion</title>
  <desc id="desc">A light animated systems map converges through a luminous continuous orbit, representing developer platforms, research software, local-first tools, and creative technology.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="400" y1="95" x2="880" y2="305" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#db2777"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="rail" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      .signal { stroke-dasharray: 24 360; }
      @keyframes signal-flow { to { stroke-dashoffset: -384; } }
      @keyframes node-pulse { 0%, 100% { opacity: .42; transform: scale(.84); } 50% { opacity: 1; transform: scale(1.18); } }
      @keyframes twinkle { 0%, 100% { opacity: .14; } 50% { opacity: .72; } }
      @keyframes orbit-breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: no-preference) {
        .signal { animation: signal-flow 9s linear infinite; }
        .signal.reverse { animation-direction: reverse; animation-duration: 12s; }
        .node { transform-box: fill-box; transform-origin: center; animation: node-pulse 5s ease-in-out infinite; }
        .node.delay-a { animation-delay: -1.6s; }
        .node.delay-b { animation-delay: -3.2s; }
        .star { animation: twinkle 7s ease-in-out infinite; }
        .star.delay-a { animation-delay: -2.3s; }
        .star.delay-b { animation-delay: -4.6s; }
        .orbit-core { animation: orbit-breathe 8s ease-in-out infinite; }
      }
    </style>
  </defs>

  <rect width="1280" height="400" rx="28" fill="url(#background)"/>
  <ellipse cx="615" cy="195" rx="390" ry="220" fill="url(#violet-glow)"/>
  <ellipse cx="915" cy="205" rx="320" ry="190" fill="url(#cyan-glow)"/>

  <g fill="none" stroke="#475569" stroke-width="1" opacity="0.07">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <g fill="#334155">
    <circle class="star" cx="84" cy="54" r="1.7"/>
    <circle class="star delay-a" cx="214" cy="92" r="1.2"/>
    <circle class="star delay-b" cx="352" cy="44" r="1.5"/>
    <circle class="star delay-a" cx="512" cy="74" r="1.1"/>
    <circle class="star" cx="690" cy="38" r="1.5"/>
    <circle class="star delay-b" cx="834" cy="82" r="1.2"/>
    <circle class="star" cx="1018" cy="48" r="1.6"/>
    <circle class="star delay-a" cx="1192" cy="88" r="1.2"/>
    <circle class="star delay-b" cx="146" cy="346" r="1.4"/>
    <circle class="star" cx="1104" cy="338" r="1.5"/>
  </g>

  <g fill="none" stroke="url(#rail)" stroke-width="1.5">
    <path d="M96 118C214 118 282 148 408 190"/>
    <path d="M70 202H402"/>
    <path d="M116 286C232 286 292 250 408 210"/>
    <path d="M872 190C994 152 1052 124 1186 124"/>
    <path d="M878 202H1214"/>
    <path d="M872 214C1000 256 1068 286 1192 286"/>
  </g>
  <g fill="none" stroke="url(#orbit)" stroke-width="2.4" stroke-linecap="round" opacity="0.72">
    <path class="signal" d="M96 118C214 118 282 148 408 190"/>
    <path class="signal reverse" d="M70 202H402"/>
    <path class="signal" d="M116 286C232 286 292 250 408 210"/>
    <path class="signal reverse" d="M872 190C994 152 1052 124 1186 124"/>
    <path class="signal" d="M878 202H1214"/>
    <path class="signal reverse" d="M872 214C1000 256 1068 286 1192 286"/>
  </g>

  <path d="M640 200C560 80 400 80 400 200S560 320 640 200S880 80 880 200S720 320 640 200" fill="none" stroke="#7c3aed" stroke-width="28" opacity="0.11" filter="url(#soft-glow)"/>
  <path class="orbit-core" d="M640 200C560 80 400 80 400 200S560 320 640 200S880 80 880 200S720 320 640 200" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <path class="signal" d="M640 200C560 80 400 80 400 200S560 320 640 200S880 80 880 200S720 320 640 200" pathLength="384" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.94"/>

  <g fill="#f8fafc" stroke-width="2">
    <circle class="node" cx="96" cy="118" r="8" stroke="#2563eb"/>
    <circle class="node delay-a" cx="70" cy="202" r="7" stroke="#7c3aed"/>
    <circle class="node delay-b" cx="116" cy="286" r="8" stroke="#db2777"/>
    <circle class="node delay-a" cx="1186" cy="124" r="8" stroke="#0891b2"/>
    <circle class="node delay-b" cx="1214" cy="202" r="7" stroke="#7c3aed"/>
    <circle class="node" cx="1192" cy="286" r="8" stroke="#0891b2"/>
    <circle class="node delay-b" cx="640" cy="200" r="9" stroke="#312e81"/>
  </g>

  <g fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.22">
    <path d="M180 118L234 82L286 114L340 78"/>
    <path d="M944 292L996 326L1052 294L1110 324"/>
  </g>
  <g fill="#6d28d9" opacity="0.56">
    <circle cx="180" cy="118" r="2"/><circle cx="234" cy="82" r="2"/><circle cx="286" cy="114" r="2"/><circle cx="340" cy="78" r="2"/>
    <circle cx="944" cy="292" r="2"/><circle cx="996" cy="326" r="2"/><circle cx="1052" cy="294" r="2"/><circle cx="1110" cy="324" r="2"/>
  </g>

  <path d="M56 352H1224" stroke="url(#rail)" stroke-width="1" opacity="0.42"/>
  <g fill="#7c3aed" opacity="0.58">
    <rect x="56" y="347" width="3" height="10" rx="1.5"/>
    <rect x="322" y="347" width="3" height="10" rx="1.5"/>
    <rect x="638" y="345" width="4" height="14" rx="2"/>
    <rect x="954" y="347" width="3" height="10" rx="1.5"/>
    <rect x="1221" y="347" width="3" height="10" rx="1.5"/>
  </g>
</svg>
