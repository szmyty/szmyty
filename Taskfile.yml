---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  git:
    taskfile: .tasks/git.yml
    optional: true
  security:
    taskfile: .tasks/security.yml
    optional: true
  tests:
    taskfile: .tasks/tests.yml
    optional: true

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  lint:
    desc: Run formatting and markdown checks
    cmds:
      - npx prettier --check .
      - npx markdownlint .

  fmt:
    desc: Format all files
    cmds:
      - npx prettier --write .

  health:
    desc: Validate repository structure
    cmds:
      - 'test -f README.md && echo "PASS: README.md exists" || (echo "FAIL: Missing README.md" && exit 1)'
      - 'test -d .github/workflows && echo "PASS: .github/workflows exists" || (echo "FAIL: Missing .github/workflows" && exit 1)'
      - 'test -f .editorconfig && echo "PASS: .editorconfig exists" || (echo "FAIL: Missing .editorconfig" && exit 1)'
      - 'test -d docs && echo "PASS: docs exists" || (echo "FAIL: Missing docs/" && exit 1)'
      - 'echo "Repository health check passed"'

  repo:audit:
    desc: Placeholder for audit tasks
    cmds:
      - echo "Audit task placeholder"

  check-identity:
    desc: Reject stale source-repository names and obsolete production URLs
    cmds:
      - bash .tasks/check-identity.sh

  validate-profile:
    desc: Validate active profile inputs, assets, and README output
    preconditions:
      - sh: python -c "import click, yaml, pydantic" >/dev/null 2>&1
        msg: "Project dependencies are missing. Run: poetry install"
    cmds:
      - python -m tools.profile_builder.cli validate
      - python profile/validate_assets.py assets/profile

  update-profile:
    desc: Refresh public profile module artifacts and README locally
    preconditions:
      - sh: python -c "import click, yaml, pydantic" >/dev/null 2>&1
        msg: "Project dependencies are missing. Run: poetry install"
    cmds:
      - python -m tools.modules.github_metrics --output profile/artifacts/github-metrics/cache.json
      - python -m tools.modules.recent_activity --output profile/artifacts/recent-activity/cache.json
      - |
        python -m tools.modules.music_highlight \
          --input profile/content/music-highlight.yml \
          --output profile/artifacts/music-highlight/music.yml
      - python -m tools.modules.update_readme

  validate-site:
    desc: Validate evidence-backed Pages output and deployment inputs
    preconditions:
      - sh: command -v pytest >/dev/null 2>&1
        msg: "pytest is not installed. Run: poetry install --with test"
    cmds:
      - python -m tools.modules.site_companion --check
      - python -m pytest tests/test_site_companion.py tests/test_workflows.py
