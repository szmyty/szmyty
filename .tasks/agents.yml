---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  models:
    desc: List locally installed Ollama models
    preconditions:
      - sh: command -v ollama >/dev/null 2>&1
        msg: "Ollama is not installed or is not on PATH."
    cmds:
      - ollama list

  running-models:
    desc: Show models currently loaded by Ollama
    preconditions:
      - sh: command -v ollama >/dev/null 2>&1
        msg: "Ollama is not installed or is not on PATH."
    cmds:
      - ollama ps
