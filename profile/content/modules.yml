# modules.yml
# Declares profile modules and their README region ownership.
#
# Each module owns exactly one pair of HTML-comment markers in README.md:
#   <!-- START:<name> -->   … generated content …   <!-- END:<name> -->
#
# Hand-authored sections outside those markers are never modified.
# Set enabled: false to disable a module without removing its markers;
# the README region will remain empty and the file stays coherent.
#
# Schema: profile/schemas/modules.json

modules:
  - name: github-metrics
    enabled: true
    region_start_marker: "<!-- START:github-metrics -->"
    region_end_marker: "<!-- END:github-metrics -->"
    template: github-metrics.md.j2
    artifact_path: profile/artifacts/github-metrics/cache.json

  - name: recent-activity
    enabled: true
    region_start_marker: "<!-- START:recent-activity -->"
    region_end_marker: "<!-- END:recent-activity -->"
