# modules.yml
# Compatibility mirror for README region ownership.
#
# Each module owns exactly one pair of HTML-comment markers in README.md:
#   <!-- START:<name> -->   … generated content …   <!-- END:<name> -->
#
# Hand-authored sections outside those markers are never modified.
# Canonical module metadata lives in profile/content/modules-registry.yml.
# Keep overlapping entries synchronized with the registry.
#
# Schema: profile/schemas/modules.json

modules:
  - name: github-dashboard
    enabled: false
    region_start_marker: "<!-- START:github-dashboard -->"
    region_end_marker: "<!-- END:github-dashboard -->"
    template: github-dashboard.md.j2
    artifact_path: profile/artifacts/github-dashboard/snapshot.json

