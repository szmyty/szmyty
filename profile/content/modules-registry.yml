# modules-registry.yml
# Extended registry for the snapshot-module platform.
#
# Each entry declares everything needed to fetch, normalize, cache, and render
# one profile module — provider type, secret names (never values), sensitivity,
# freshness policy, artifact layout, and README region ownership.
#
# Schema: profile/schemas/modules-registry.json

modules:
  - name: github-dashboard
    enabled: true
    description: "Builds a first-party visual GitHub engineering dashboard from public GitHub REST and GraphQL data."
    provider_type: api
    provider_module: tools.modules.github_dashboard
    secret_names:
      - GITHUB_TOKEN
    sensitivity: public
    freshness_policy:
      cadence: daily
      ttl_seconds: 86400
      warn_after_seconds: 172800
    artifact_dir: profile/artifacts/github-dashboard
    artifact_file: snapshot.json
    asset_files:
      - metadata.json
      - card-light.svg
      - card-dark.svg
      - card-mobile-light.svg
      - card-mobile-dark.svg
    fixture_file: profile/fixtures/github-dashboard.json
    readme_path: README.md
    region_start_marker: "<!-- START:github-dashboard -->"
    region_end_marker: "<!-- END:github-dashboard -->"
    template: github-dashboard.md.j2

  - name: weather
