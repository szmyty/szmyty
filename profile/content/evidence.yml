# evidence.yml
# Schema-backed evidence catalog for profile claims.
#
# Schema
# ------
# id:               string  — stable, unique identifier (kebab-case)
# claim:            string  — candidate claim text as it might appear in a profile
# evidence_type:    one of: url | repo-path | self-reported | inferred | none
# url:              string  — public URL to the evidence artifact (optional)
# repo_path:        string  — repository-relative path to the artifact (optional)
# status:           one of: verified | needs-user-verification | excluded
# sensitivity:      one of: public | sensitive | internal
# last_reviewed:    date    — ISO-8601 date (YYYY-MM-DD)
# notes:            string  — safe-wording notes or exclusion rationale (optional)
#
# Rules
# -----
# - Unknown metrics, adoption, impact, dates, ownership, and technology claims
#   MUST be marked needs-user-verification.
# - Do NOT mark a claim verified solely because it appeared in an old README.
# - Do NOT publish records marked needs-user-verification automatically.
# - Sensitive records MUST be marked excluded and MUST NOT have a public url.

