<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img"><title>Oura aggregate wellness trends</title><desc>Coarse weekly sleep, readiness, and activity score trends. No daily records or exact schedules are published.</desc><rect x="1" y="1" width="358" height="498" rx="18" fill="#FFFFFF" stroke="#D0D7DE"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"><text x="28" y="42" fill="#1F2328" font-size="13" font-weight="700">OURA · AGGREGATE TRENDS</text><text x="28" y="70" fill="#59636E" font-size="12">Jul 2026 · 82 contributing days</text><text x="30" y="127" fill="#59636E" font-size="11" font-weight="650">SLEEP SCORE</text><text x="330" y="127" text-anchor="end" fill="#8B5CF6" font-size="15" font-weight="720">—</text><line x1="30" y1="203" x2="330" y2="203" stroke="#D8DEE4" stroke-width="1"/><text x="30" y="237" fill="#59636E" font-size="11" font-weight="650">READINESS SCORE</text><text x="330" y="237" text-anchor="end" fill="#EC4899" font-size="15" font-weight="720">—</text><line x1="30" y1="313" x2="330" y2="313" stroke="#D8DEE4" stroke-width="1"/><text x="30" y="347" fill="#59636E" font-size="11" font-weight="650">ACTIVITY SCORE</text><text x="330" y="347" text-anchor="end" fill="#10B981" font-size="15" font-weight="720">—</text><line x1="30" y1="423" x2="330" y2="423" stroke="#D8DEE4" stroke-width="1"/><text x="28" y="478" fill="#59636E" font-size="11">Weekly averages rounded to 5-point buckets · recent days excluded</text></g></svg>