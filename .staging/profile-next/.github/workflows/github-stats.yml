name: GitHub Statistics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: github-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: .github/artifacts/github-stats/overview.svg
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_traffic: yes
          output_action: none
          committer_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: .github/artifacts/github-stats/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, shell, cmake
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          output_action: none
          committer_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contributions metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: .github/artifacts/github-stats/contributions.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: none
          committer_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/artifacts/github-stats/
          git diff --staged --quiet || git commit -m "chore(artifacts): update github-stats [skip ci]"
          git push
