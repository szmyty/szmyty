name: Setup Flutter
description: >
  Installs the Flutter SDK, restores the pub cache, and fetches all package
  dependencies for the egohygiene Flutter application.

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: '3.44.2'
  working-directory:
    description: Path to the Flutter application root (relative to repository root)
    required: false
    default: apps/egohygiene

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Cache pub packages
      uses: actions/cache@v4
      with:
        path: ${{ env.PUB_CACHE }}
        key: ${{ runner.os }}-pub-${{ hashFiles('apps/egohygiene/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get
