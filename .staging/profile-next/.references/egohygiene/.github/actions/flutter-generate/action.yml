name: Generate Flutter Code
description: >
  Runs localization generation (slang) and build_runner code generation for
  the egohygiene Flutter application.

inputs:
  working-directory:
    description: Path to the Flutter application root (relative to repository root)
    required: false
    default: apps/egohygiene

runs:
  using: composite
  steps:
    - name: Generate Localization
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart run slang

    - name: Generate Code
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: dart run build_runner build --delete-conflicting-outputs
