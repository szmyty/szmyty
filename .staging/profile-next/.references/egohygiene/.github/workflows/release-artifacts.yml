name: Release Artifacts

# Triggered when a versioned release is published (tag starting with "v").
# Builds all three platform targets in parallel, then attaches the resulting
# artifacts to the release.  Artifacts are built from the exact tagged commit
# so release outputs are deterministic and traceable.
#
# Job dependency graph:
#   build-android ──┐
#   build-web ──────┼── attach-artifacts
#   build-linux ────┘

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:

  build-android:
    name: Build Android
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/egohygiene
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/egohygiene/android/gradle/wrapper/gradle-wrapper.properties', 'apps/egohygiene/android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Code
        uses: ./.github/actions/flutter-generate

      - name: Build Android APK
        run: flutter build apk --release

      - name: Stage Android Artifact
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-assets/egohygiene-${{ github.event.release.tag_name }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: apps/egohygiene/release-assets/egohygiene-${{ github.event.release.tag_name }}.apk

  build-web:
    name: Build Web
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/egohygiene
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Generate Code
        uses: ./.github/actions/flutter-generate

      - name: Build Web
        run: flutter build web --release

      - name: Stage Web Artifact
        run: |
          mkdir -p release-assets
          tar -czf release-assets/egohygiene-web-${{ github.event.release.tag_name }}.tar.gz \
            -C build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: apps/egohygiene/release-assets/egohygiene-web-${{ github.event.release.tag_name }}.tar.gz

  build-linux:
    name: Build Linux
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/egohygiene
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Install Linux Build Dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Generate Code
        uses: ./.github/actions/flutter-generate

      - name: Build Linux
        run: flutter build linux --release

      - name: Stage Linux Artifact
        run: |
          mkdir -p release-assets
          tar -czf release-assets/egohygiene-linux-${{ github.event.release.tag_name }}.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: apps/egohygiene/release-assets/egohygiene-linux-${{ github.event.release.tag_name }}.tar.gz

  attach-artifacts:
    name: Attach Artifacts to Release
    needs: [build-android, build-web, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets/

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: release-web
          path: release-assets/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-assets/

      - name: Attach Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release-assets/egohygiene-${{ github.event.release.tag_name }}.apk
            release-assets/egohygiene-web-${{ github.event.release.tag_name }}.tar.gz
            release-assets/egohygiene-linux-${{ github.event.release.tag_name }}.tar.gz
          overwrite_files: true
