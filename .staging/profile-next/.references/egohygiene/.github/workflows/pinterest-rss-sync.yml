name: Pinterest RSS Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - "publishing/tools/pinterest-rss/**"
      - "publishing/channels/pinterest/config.yaml"
      - ".github/workflows/pinterest-rss-sync.yml"

concurrency:
  group: pinterest-rss-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Pinterest Feed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: publishing/tools/pinterest-rss/.venv
          key: ${{ runner.os }}-poetry-pinterest-rss-${{ hashFiles('publishing/tools/pinterest-rss/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-pinterest-rss-

      - name: Install dependencies
        working-directory: publishing/tools/pinterest-rss
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run Pinterest RSS sync
        working-directory: ${{ github.workspace }}
        run: poetry run --directory publishing/tools/pinterest-rss pinterest-rss sync --config publishing/channels/pinterest/config.yaml

      - name: Commit synchronized content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publishing/channels/pinterest/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "assets(pinterest): 🍱 sync Pinterest feed [skip ci]"
            git push
          fi
