name: Release Please

# Triggered only after the Development Build workflow completes successfully on
# main, ensuring releases are never published while validation is still running
# or has failed.  workflow_dispatch allows manual invocation for recovery.

on:
  workflow_run:
    workflows: ["Development Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # For workflow_run triggers, only proceed when the upstream workflow succeeded.
    # workflow_dispatch always proceeds (useful for recovery or first-time setup).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
