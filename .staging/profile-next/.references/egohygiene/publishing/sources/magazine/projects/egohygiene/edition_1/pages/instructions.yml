ego_hygiene_magazine_page_template:

  instructions_for_ai:
    goal: >
      Generate a full-page illustrated infographic poster using the Ego Hygiene
      magazine style. Replace placeholder content while maintaining layout,
      typography hierarchy, and visual style.

    rules:
      - Maintain vertical poster layout
      - Keep central human-figure composition
      - Maintain 4 informational boxes around center
      - Preserve golden cosmic aesthetic
      - Replace placeholder text and imagery with relevant content
      - Do not change layout structure

  canvas:
    width_px: 2063
    height_px: 3150
    orientation: portrait

  layout_structure:

    header_symbol:
      placeholder_symbol: "INFINITY_SYMBOL_OR_OTHER_SPIRITUAL_ICON"
      description: "small glowing symbol centered above title"

    main_title:
      placeholder_text: "PAGE_TITLE"
      example: "MOVEMENT"
      style:
        case: uppercase
        weight: bold
        color: glowing_gold
        texture: slightly_distressed

    subtitle:
      placeholder_text: "SHORT_TOPIC_DESCRIPTION"
      example: "PRACTICES FOR NERVOUS SYSTEM REGULATION"
      style:
        case: uppercase
        font_style: clean_sans_serif
        color: light_gold
        letter_spacing: wide

  central_visual:

    placeholder_image_description: >
      CENTER_IMAGE_DESCRIPTION

    example: >
      glowing human silhouette surrounded by energy trails,
      cosmic particles, and motion echoes.

    requirements:
      - centered vertically
      - occupies about 40 percent of page height
      - radiant glow around figure
      - subtle motion silhouettes behind
      - cosmic background energy

  information_boxes:

    upper_left_box:
      title_placeholder: "BOX_1_TITLE"
      text_placeholder: "BOX_1_DESCRIPTION"

      example:
        title: "MOVE"
        text: "Change posture or position."

    upper_right_box:
      title_placeholder: "BOX_2_TITLE"
      text_placeholder: "BOX_2_DESCRIPTION"

      example:
        title: "MOBILIZE"
        text: "Invite gentle range and circulation."

    lower_left_box:
      title_placeholder: "BOX_3_TITLE"
      text_placeholder: "BOX_3_DESCRIPTION"

      example:
        title: "STRETCH"
        text: "Ease tension without forcing range."

    lower_right_box:
      title_placeholder: "BOX_4_TITLE"
      text_placeholder: "BOX_4_DESCRIPTION"

      example:
        title: "RELEASE"
        text: "Allow excess activation to discharge."

    box_style:
      shape: rounded_rectangle
      border_color: glowing_gold
      border_effect: soft_glow
      interior_color: dark_cosmic_brown
      text_alignment: center

  effect_section:

    title_placeholder: "EFFECT_TITLE"

    description_placeholder: >
      EFFECT_DESCRIPTION

    example:
      title: "EFFECT"
      description: >
        Regulates the nervous system, reduces stored tension,
        and restores embodied balance.

    style:
      alignment: centered_box
      width: wide
      border: glowing_gold

  closing_statement:

    primary_line_placeholder: "CLOSING_MANTRA_PRIMARY"
    secondary_line_placeholder: "CLOSING_MANTRA_SECONDARY"

    example:
      primary: "MOVE YOUR BODY. CALM YOUR MIND."
      secondary: "FEEL AT HOME IN YOURSELF."

    style:
      alignment: center
      primary_weight: bold
      secondary_weight: light

  decorative_elements:

    background:
      style: cosmic_nebula
      colors:
        - dark_purple
        - deep_brown
        - glowing_gold

    particles:
      description: small glowing sparkles scattered throughout

    energy_trails:
      description: curved golden lines around center figure

    crystals:
      placement:
        - bottom_left_corner
        - bottom_right_corner

  color_palette:

    primary:
      gold: "#f5b84c"
      amber: "#ff9d2e"
      burnt_orange: "#cc6a1c"

    secondary:
      cosmic_purple: "#2c1b2f"
      deep_brown: "#2b1c12"

    accent:
      cream: "#f2e6d6"
      white_spark: "#fff6d5"

  replacement_tokens_summary:

    - PAGE_TITLE
    - SHORT_TOPIC_DESCRIPTION
    - CENTER_IMAGE_DESCRIPTION

    - BOX_1_TITLE
    - BOX_1_DESCRIPTION

    - BOX_2_TITLE
    - BOX_2_DESCRIPTION

    - BOX_3_TITLE
    - BOX_3_DESCRIPTION

    - BOX_4_TITLE
    - BOX_4_DESCRIPTION

    - EFFECT_TITLE
    - EFFECT_DESCRIPTION

    - CLOSING_MANTRA_PRIMARY
    - CLOSING_MANTRA_SECONDARY
