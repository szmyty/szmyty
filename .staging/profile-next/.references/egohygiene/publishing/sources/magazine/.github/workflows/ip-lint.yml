name: IP Reference Lint Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ip-lint:
    name: Check for External IP References
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run IP Reference Lint Check
        run: python3 scripts/lint_ip_references.py
