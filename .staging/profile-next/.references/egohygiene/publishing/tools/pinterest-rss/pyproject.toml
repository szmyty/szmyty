[tool.poetry]
name = "pinterest-rss"
version = "0.1.0"
description = "Incremental Pinterest RSS ingestion tool for Ego Hygiene"
authors = ["Alan Szmyt <szmyty@gmail.com>"]
readme = "README.md"
packages = [{ include = "pinterest_rss", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.3.3"
rich = "^15.0.0"
httpx = "^0.28.1"
pyyaml = "^6.0.3"
feedparser = "^6.0.11"
structlog = "^25.5.0"
tenacity = "^9.1.2"

[tool.poetry.scripts]
pinterest-rss = "pinterest_rss.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "types-pyyaml (>=6.0.12,<7.0.0)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
