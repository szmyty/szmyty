# Pinterest RSS ingestion configuration for Ego Hygiene
#
# Environment-variable overrides (optional):
#   PINTEREST_RSS_URL               – overrides the feed URL for the first feed
#   PINTEREST_OUTPUT_DIRECTORY      – overrides the output path for the first feed
#   PINTEREST_DOWNLOAD_IMAGES       – set to "false" to skip image downloads

feeds:
  - id: ego-hygiene
    url: https://www.pinterest.com/egohygiene/ego-hygiene.rss
    output: publishing/channels/pinterest/boards/ego-hygiene
