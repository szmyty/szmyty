<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <linearGradient id="footerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4a4e69" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="80" rx="8" fill="url(#footerGradient)"/>
  <rect width="1200" height="80" fill="url(#grid)" rx="8"/>

  <!-- Decorative accent line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>

  <!-- Left bracket -->
  <path d="M 80 25 L 65 40 L 80 55" fill="none" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Right bracket -->
  <path d="M 1120 25 L 1135 40 L 1120 55" fill="none" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Footer text -->
  <text x="600" y="35" font-family="'SF Mono', 'Fira Code', 'Monaco', 'Consolas', monospace" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="1">Made with ♥ by Alan Szmyt</text>
  <text x="600" y="56" font-family="'SF Mono', 'Fira Code', 'Monaco', 'Consolas', monospace" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="0.5">Software Engineer · AI Builder · Systems Thinker · Creative Technologist</text>
</svg>
